<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover">
  <title>My LIFF</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; }
    .preview-box {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      background: #f9f9f9;
      min-height: 300px;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-top: 10px;
    }
    .card-text { font-size: 16px; margin-bottom: 10px; }
    .btn-flex {
      display: inline-block;
      margin: 5px 0;
      padding: 10px 15px;
      border-radius: 6px;
      text-align: center;
      color: white;
      text-decoration: none;
    }
    .btn-green { background: #00C853; }
    .btn-red { background: #FF0000; }
  </style>
</head>
<body>
  <div class="row">
    <!-- ======= ฟอร์มด้านซ้าย ======= -->
    <div class="col-md-6">
      <h4>Flex Form</h4>
      <div class="mb-3">
        <label for="flexjson" class="form-label">JSON - </label>
        <a href="https://developers.line.biz/flex-simulator" target="_blank" class="link-info">FLEX MESSAGE SIMULATOR</a>
        <textarea class="form-control" id="flexjson" name="flexjson" rows="20" onchange="myFunction()">{
  "type": "bubble",
  "body": {
    "type": "box",
    "layout": "vertical",
    "contents": [
      {
        "type": "text",
        "text": "hello"
      }
    ]
  }
}</textarea>
      </div>

      <!-- ช่องแสดง URL -->
      <div class="input-group mb-3">
        <input type="text" class="form-control" id="demo" placeholder="Ctrl+C > Copy liff url.">
        <button class="btn btn-outline-secondary" type="button" onclick="copyUrl()">Copy</button>
      </div>

      <!-- ปุ่ม Flex ตัวอย่าง -->
      <button type="button" class="btn btn-outline-primary" onclick="flex_1()">Flex1</button>
      <button type="button" class="btn btn-outline-primary" onclick="flex_2()">Flex2</button>
      <button type="button" class="btn btn-outline-primary" onclick="flex_3()">Flex3</button>
      <button type="button" class="btn btn-outline-primary" onclick="flex_4()">Flex4</button>
      <br/><br/>

      <!-- ปุ่มบันทึกและแชร์ -->
      <button type="button" class="btn btn-success" onclick="saveShare()">Save liff</button>
      <button type="button" class="btn btn-success" onclick="sendShare()">Share Target Picker</button>
      <button type="button" class="btn btn-warning" onclick="previewFlex()">Preview Flex</button>
    </div>

    <!-- ======= Preview ด้านขวา ======= -->
    <div class="col-md-6">
      <h4>Preview</h4>
      <div class="preview-box" id="flexPreview">ยังไม่มี Preview</div>
    </div>
  </div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // -----------------------
    // ฟังก์ชันตรวจสอบ JSON
    // -----------------------
    function myFunction() {
      var x = document.getElementById("flexjson").value;
      try {
        x = JSON.parse(x);
        var flexdat = { "type": "flex", "altText": "Preview Flex", "contents": x };
        return flexdat;
      } catch (err) {
        console.log("JSON Error:", err);
        return "failed";
      }
    }

    // -----------------------
    // Preview Flex การ์ด mockup
    // -----------------------
    function previewFlex() {
      if (myFunction() === "failed") {
        alert("JSON ไม่ถูกต้อง");
        return;
      }
      const flexData = myFunction().contents;
      const previewElement = document.getElementById("flexPreview");

      let html = `<div class="card">`;

      if (flexData.body && flexData.body.contents) {
        flexData.body.contents.forEach(item => {
          if (item.type === "text") {
            html += `<div class="card-text">${item.text}</div>`;
          }
        });
      }

      // ปุ่ม mockup
      html += `<a href="#" class="btn-flex btn-green">CALL</a>`;
      html += `<a href="#" class="btn-flex btn-red">Share</a>`;
      html += `</div>`;

      previewElement.innerHTML = html;
    }

    // -----------------------
    // Flex ตัวอย่าง
    // -----------------------
    function flex_1() {
      const f1 = {
        "type": "bubble",
        "body": { "type": "box", "layout": "vertical", "contents": [{ "type": "text", "text": "hello", "align": "start" }] }
      }
      document.getElementById("flexjson").value = JSON.stringify(f1, null, 2);
    }
    function flex_2() {
      const f2 = {
        "type": "bubble",
        "body": { "type": "box", "layout": "vertical", "contents": [{ "type": "text", "text": "hello", "align": "center" }] }
      }
      document.getElementById("flexjson").value = JSON.stringify(f2, null, 2);
    }
    function flex_3() {
      const f3 = {
        "type": "bubble",
        "body": { "type": "box", "layout": "vertical", "contents": [{ "type": "text", "text": "hello", "align": "end" }] }
      }
      document.getElementById("flexjson").value = JSON.stringify(f3, null, 2);
    }
    function flex_4() {
      const f4 = {
        "type": "bubble",
        "body": { "type": "box", "layout": "vertical", "contents": [{ "type": "text", "text": "hello", "color": "#ff0000" }] }
      }
      document.getElementById("flexjson").value = JSON.stringify(f4, null, 2);
    }

    // -----------------------
    // Save liff (เก็บ JSON -> GAS)
    // -----------------------
    function saveShare() {
      var sflex = document.getElementById("flexjson").value;
      let code = window.btoa(sflex);
      let lid = "lid" + Date.now();
      document.getElementById("demo").value = "https://liff.line.me/2000581772-J4jdMX8q/?flexid=" + lid;

      const xurl = "https://script.google.com/macros/s/AKfycbwktB_ZSm_VDDImG85Q4abmjDcBGHQqusr4PMsoWlT1d9fsADr6NaaM81uBnqq4exVL/exec";
      var xmlhttp = new XMLHttpRequest();
      xmlhttp.open("POST", xurl);
      xmlhttp.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
      xmlhttp.send(JSON.stringify({ "lid": lid, "desc": code }));
      xmlhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
          var jsonResponse = JSON.parse(this.responseText);
          alert("บันทึกแล้ว: " + jsonResponse.desc);
        }
      }
    }

    // -----------------------
    // Share Target Picker
    // -----------------------
    async function sendShare() {
      if (myFunction() !== "failed") {
        const result = await liff.shareTargetPicker([myFunction()]);
        if (result) {
          alert(`[${result.status}] Message sent!`);
          liff.closeWindow();
        } else {
          alert("ShareTargetPicker ถูกยกเลิก");
        }
      } else {
        alert("JSON ไม่ถูกต้อง");
      }
    }

    // -----------------------
    // Copy URL
    // -----------------------
    function copyUrl() {
      let copyText = document.getElementById("demo");
      copyText.select();
      document.execCommand("copy");
      alert("Copied URL: " + copyText.value);
    }

    // -----------------------
    // LIFF Init
    // -----------------------
    async function main() {
      await liff.init({ liffId: "2000581772-J4jdMX8q" });
      if (!liff.isLoggedIn()) {
        liff.login();
      }
    }
    main();
  </script>
</body>
</html>
