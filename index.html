

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Flex Message Tool</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; }
    textarea { font-family: monospace; }
  </style>
</head>
<body>
<div class="container">
  <div class="row">
    <!-- ======= Flex Form ======= -->
    <div class="col-md-6">
      <h4>Flex Form</h4>
      <div class="mb-2">
        <label for="flexjson" class="form-label">JSON</label>
        <a href="https://developers.line.biz/flex-simulator" target="_blank" class="link-info ms-2">
          FLEX MESSAGE SIMULATOR
        </a>
        <textarea class="form-control" id="flexjson" name="flexjson" rows="20" onchange="myFunction()">
{ "type": "bubble", "size": "giga", "hero": { "type": "image", "url": "https://raw.githubusercontent.com/gunttri2567/triliff2025/refs/heads/branch/images/1035089.jpg", "size": "full", "aspectRatio": "1108:1478", "aspectMode": "cover", "action": { "type": "uri", "uri": "https://raw.githubusercontent.com/gunttri2567/triliff2025/refs/heads/branch/images/1035089.jpg" } } }
        </textarea>
      </div>

      <!-- ช่อง altText -->
      <div class="mb-3">
        <label for="altText" class="form-label">altText</label>
        <input type="text" class="form-control" id="altText" placeholder="ใส่ข้อความ altText เช่น 'โปรโมชันใหม่!'">
      </div>

      <!-- ช่องแสดง URL -->
      <div class="input-group mb-3">
        <input type="text" class="form-control" id="demo" placeholder="Ctrl+C > Copy liff url.">
        <button class="btn btn-outline-secondary" type="button" onclick="copyUrl()">Copy</button>
      </div>
      
      <!-- ปุ่มต่าง ๆ -->
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-success" onclick="saveShare()">Save liff</button>
        <button type="button" class="btn btn-success" onclick="sendShare()">Share Target Picker</button>
        <button type="button" class="btn btn-warning" onclick="previewFlex()">Preview Flex</button>
      </div>
      <small class="text-muted d-block mt-2">
        * ปุ่ม Preview จะเรนเดอร์จาก JSON ที่อยู่ในช่อง textarea ตรง ๆ ทุกครั้ง
      </small>
    </div>

    <!-- ======= Flex Preview ======= -->
    <div class="col-md-6">
      <h4>Flex Preview</h4>
      <div id="flex-preview" class="border rounded p-3 bg-light">
        <em>ยังไม่มี Preview</em>
      </div>
    </div>
  </div>
</div>

<script>
function buildFlexMessageFromTextarea() {
  const raw = document.getElementById("flexjson").value;
  const alt = document.getElementById("altText").value.trim() || "Flex Preview";
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch {
    return "failed";
  }

  if (parsed.type === 'flex' && parsed.contents) {
    parsed.altText = alt;
    return parsed;
  }
  if (parsed.type === 'bubble' || parsed.type === 'carousel') {
    return {
      type: 'flex',
      altText: alt,
      contents: parsed
    };
  }
  return "failed";
}

// ฟังก์ชัน Copy URL
function copyUrl() {
  const copyText = document.getElementById("demo");
  copyText.select();
  document.execCommand("copy");
  alert("Copied the URL: " + copyText.value);
}

// ฟังก์ชัน Save Share
function saveShare() {
  const msg = buildFlexMessageFromTextarea();
  if (msg === "failed") {
    alert("❌ JSON ไม่ถูกต้อง");
    return;
  }
  console.log("✅ Save Flex:", msg);
  alert("✅ Flex ถูกบันทึกแล้ว (ดูที่ Console)");
}

// ฟังก์ชัน Share
function sendShare() {
  const msg = buildFlexMessageFromTextarea();
  if (msg === "failed") {
    alert("❌ JSON ไม่ถูกต้อง");
    return;
  }
  console.log("📤 Share Flex:", msg);
  alert("📤 Share Flex เรียบร้อย (ดูที่ Console)");
}

// ฟังก์ชัน Preview
function previewFlex() {
  const msg = buildFlexMessageFromTextarea();
  const previewDiv = document.getElementById("flex-preview");
  if (msg === "failed") {
    previewDiv.innerHTML = "<span class='text-danger'>❌ JSON ไม่ถูกต้อง</span>";
    return;
  }
  previewDiv.innerHTML = "<pre>" + JSON.stringify(msg, null, 2) + "</pre>";
}
</script>
</body>
</html>
