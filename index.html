<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover">
<title>CHATRI AYA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{padding:20px}
#previewArea{
  border:1px solid #ddd;border-radius:16px;padding:12px;
  background:#f5f7fb;min-height:420px;max-width:380px;overflow:auto
}
.flex-bubble{background:#fff;border-radius:16px;overflow:hidden;
  box-shadow:0 6px 14px rgba(0,0,0,.08);margin-bottom:16px}
.flex-hero img{width:100%;display:block}
.section{padding:12px}
.flex-footer{border-top:1px solid #eee}
.box{display:flex;gap:8px}
.box.vertical{flex-direction:column}
.box.horizontal{flex-direction:row;align-items:center}
.text{word-break:break-word;line-height:1.4}
.t-xs{font-size:12px}.t-sm{font-size:14px}.t-md{font-size:16px}
.t-lg{font-size:18px}.t-xl{font-size:20px}.t-xxl{font-size:22px}
.btn-flex{display:inline-block;padding:10px 14px;border-radius:10px;
  text-decoration:none;border:1px solid #0d6efd;color:#0d6efd}
.btn-flex.primary{background:#0d6efd;color:#fff}
.btn-flex.link{border:none;padding:0}
.sep{border-top:1px solid #e5e7eb;margin:6px 0}
</style>
</head>

<body>

<div class="row g-3">

<!-- ===== FORM ===== -->
<div class="col-md-6">
<h4>Flex Form</h4>

<div class="mb-2">
<label class="form-label">JSON</label>
<textarea id="flexjson" class="form-control" rows="20">
{
  "type": "bubble",
  "hero": {
    "type": "image",
    "url": "https://raw.githubusercontent.com/gunttri2567/triliff2025/refs/heads/branch/images/1035089.jpg",
    "size": "full",
    "aspectMode": "cover"
  }
}
</textarea>
</div>

<div class="mb-2">
<label class="form-label">altText</label>
<input id="altText" class="form-control" placeholder="ข้อความสั้น ๆ">
</div>

<div class="input-group mb-3">
<input id="demo" class="form-control" placeholder="LIFF URL">
<button class="btn btn-outline-secondary" onclick="copyUrl()">Copy</button>
</div>

<div class="d-flex gap-2">
<button class="btn btn-success" onclick="saveShare()">Save liff</button>
<button class="btn btn-success" onclick="sendShare()">Share Target Picker</button>
<button class="btn btn-warning" onclick="safePreview()">Preview</button>
</div>
</div>

<!-- ===== PREVIEW ===== -->
<div class="col-md-6">
<h4>Preview</h4>
<div id="previewArea"><p class="text-muted">ยังไม่มี preview</p></div>
</div>

</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
/* ===== CONFIG ===== */
const LIFF_ID = "2000581772-J4jdMX8q";
const GAS_URL = "https://script.google.com/macros/s/AKfycbwktB_ZSm_VDDImG85Q4abmjDcBGHQqusr4PMsoWlT1d9fsADr6NaaM81uBnqq4exVL/exec";

/* ===== BASE64 UTF8 ===== */
function encode64(s){return btoa(unescape(encodeURIComponent(s)));}
function decode64(s){return decodeURIComponent(escape(atob(s)));}

/* ===== URL PARAM ===== */
function getParam(n){return new URL(location.href).searchParams.get(n);}

/* ===== LOAD FLEX FROM GAS ===== */
async function loadFlexFromGAS(flexid){
  const res = await fetch(GAS_URL + "?flexid=" + flexid);
  const json = await res.json();
  if(json.desc){
    flexjson.value = decode64(json.desc);
    altText.value = json.altText || "";
  }
}

/* ===== BUILD FLEX MESSAGE ===== */
function buildFlex(){
  let raw = flexjson.value;
  let alt = altText.value || "Flex Message";
  let p = JSON.parse(raw);
  return (p.type==="flex") ? p : {type:"flex",altText:alt,contents:p};
}

/* ===== SAVE ===== */
function saveShare(){
  const lid = "lid" + Date.now();
  const code = encode64(flexjson.value);
  const alt = altText.value || "";

  demo.value = "https://liff.line.me/" + LIFF_ID + "?flexid=" + lid;

  fetch(GAS_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({lid:lid,desc:code,altText:alt})
  }).then(r=>r.json()).then(j=>{
    alert("บันทึกเรียบร้อย : " + lid);
  });
}

/* ===== SHARE ===== */
async function sendShare(){
  try{
    await liff.shareTargetPicker([buildFlex()]);
    alert("แชร์เรียบร้อย");
  }catch(e){alert("แชร์ไม่สำเร็จ");}
}

/* ===== PREVIEW ===== */
function safePreview(){
  const p=document.getElementById("previewArea");
  try{
    p.innerHTML="";
    const b=JSON.parse(flexjson.value);
    p.innerHTML="<pre>"+JSON.stringify(b,null,2)+"</pre>";
  }catch{p.innerHTML="<p class='text-danger'>JSON ผิด</p>";}
}

/* ===== COPY ===== */
function copyUrl(){
  demo.select();document.execCommand("copy");
}

/* ===== LIFF INIT ===== */
async function main(){
  await liff.init({liffId:LIFF_ID});
  if(!liff.isLoggedIn()){liff.login();return;}
  const fid=getParam("flexid");
  if(fid) await loadFlexFromGAS(fid);
  safePreview();
}
main();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
