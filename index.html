<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover">
  <title>CHATRI LIFF</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; }
    #previewArea {
      border: 1px solid #ddd; border-radius: 16px; padding: 12px;
      background: #f5f7fb; min-height: 420px; max-width: 380px; overflow: auto;
    }
    .flex-bubble { background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08); margin-bottom: 16px; }
    .flex-hero img { width: 100%; display: block; }
    .section { padding: 12px; }
    .flex-footer { border-top: 1px solid #eee; }
    .box { display: flex; gap: 8px; }
    .box.vertical { flex-direction: column; }
    .box.horizontal { flex-direction: row; align-items: center; }
    .box.baseline { flex-direction: row; align-items: baseline; }
    .text { word-break: break-word; line-height: 1.4; }
    .t-xs{font-size:12px;} .t-sm{font-size:14px;} .t-md{font-size:16px;}
    .t-lg{font-size:18px;} .t-xl{font-size:20px;} .t-xxl{font-size:22px;}
    .btn-flex { display:inline-block; padding:10px 14px; border-radius:10px;
      text-decoration:none; border:1px solid #0d6efd; color:#0d6efd; }
    .btn-flex.primary { background:#0d6efd; color:#fff; border-color:#0d6efd; }
    .btn-flex.link { border:none; padding:0; color:#0d6efd; }
    .sep { border-top:1px solid #e5e7eb; margin:6px 0; }
    .icon { width: 20px; height: 20px; display:inline-block; }
  </style>
</head>
<body>
  <div class="row g-3">
    <div class="col-md-6">
      <h4>Flex Form</h4>
      <div class="mb-2">
        <label for="flexjson" class="form-label">JSON</label>
        <textarea class="form-control" id="flexjson" rows="20">{
  "type": "bubble",
  "size": "giga",
  "hero": {
    "type": "image",
    "url": "https://raw.githubusercontent.com/gunttri2567/triliff2025/refs/heads/branch/images/1035089.jpg",
    "size": "full",
    "aspectRatio": "1108:1478",
    "aspectMode": "cover"
  }
}</textarea>
      </div>
      <div class="mb-2">
        <label for="altText" class="form-label">altText</label>
        <input type="text" class="form-control" id="altText" placeholder="ข้อความสั้น ๆ ที่จะแสดงแทน Flex Message">
      </div>
      <div class="input-group mb-3">
        <input type="text" class="form-control" id="demo" placeholder="Ctrl+C > Copy liff url.">
        <button class="btn btn-outline-secondary" type="button" onclick="copyUrl()">Copy</button>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-success" onclick="saveShare()">Save liff</button>
        <button type="button" class="btn btn-success" onclick="sendShare()">Share Target Picker</button>
        <button type="button" class="btn btn-warning" onclick="previewFlex()">Preview Flex</button>
      </div>
    </div>
    <div class="col-md-6">
      <h4>Preview</h4>
      <div id="previewArea"><p class="text-muted">ยังไม่มี preview</p></div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = "2000581772-J4jdMX8q";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwktB_ZSm_VDDImG85Q4abmjDcBGHQqusr4PMsoWlT1d9fsADr6NaaM81uBnqq4exVL/exec";

    // ---------------- Utils ----------------
    function buildFlexMessageFromTextarea() {
      const raw = document.getElementById("flexjson").value;
      const alt = document.getElementById("altText").value.trim() || "Flex Preview";
      let parsed;
      try { parsed = JSON.parse(raw); } catch { return "failed"; }
      if (parsed.type === 'flex' && parsed.contents) { parsed.altText = alt; return parsed; }
      if (parsed.type === 'bubble' || parsed.type === 'carousel') {
        return { type: 'flex', altText: alt, contents: parsed };
      }
      return "failed";
    }

    function appendShareButton(contents, flexid){
      function addBtn(bubble){
        if(!bubble.footer){
          bubble.footer = { type:"box", layout:"vertical", contents:[] };
        }
        bubble.footer.contents.push({
          type:"button", style:"primary", color:"#0d6efd",
          action:{ type:"uri", label:"แชร์ต่อ", uri:`line://app/${LIFF_ID}?flexid=${flexid}` }
        });
      }
      if(contents.type==="bubble") addBtn(contents);
      if(contents.type==="carousel") (contents.contents||[]).forEach(b=>addBtn(b));
      return contents;
    }

    function copyUrl(){
      let copyText=document.getElementById("demo");
      copyText.select(); document.execCommand("copy");
      alert("Copied URL: "+copyText.value);
    }

    // ---------------- Save & Share ----------------
    function saveShare(){
      const msg = buildFlexMessageFromTextarea();
      if(msg==="failed"){ alert("JSON ไม่ถูกต้อง"); return; }
      let lid = "lid" + Date.now();

      // append share button
      msg.contents = appendShareButton(msg.contents, lid);

      // save to GAS
      let code = window.btoa(JSON.stringify(msg));
      document.getElementById("demo").value = `https://liff.line.me/${LIFF_ID}/?flexid=${lid}`;
      var xmlhttp=new XMLHttpRequest();
      xmlhttp.open("POST", GAS_URL);
      xmlhttp.setRequestHeader("Content-Type","application/json;charset=UTF-8");
      xmlhttp.send(JSON.stringify({ "lid": lid, "desc": code }));
      xmlhttp.onreadystatechange=function(){
        if(this.readyState==4&&this.status==200){
          var jsonResponse=JSON.parse(this.responseText);
          alert("บันทึกแล้ว: "+jsonResponse.desc);
        }
      }
    }

    async function sendShare(){
      const msg = buildFlexMessageFromTextarea();
      if(msg==="failed"){ alert("JSON ไม่ถูกต้อง"); return; }
      try{
        await liff.shareTargetPicker([msg]);
      }catch(e){ console.error(e); alert("แชร์ไม่สำเร็จ"); }
    }

    function previewFlex(){
      const raw = document.getElementById("flexjson").value;
      let parsed;
      try { parsed = JSON.parse(raw); } catch { parsed = null; }
      if(parsed){
        document.getElementById("previewArea").innerHTML =
          '<img src="'+(parsed.hero?.url || 'https://via.placeholder.com/300x200?text=Preview')+'" class="img-fluid rounded">';
      } else {
        document.getElementById("previewArea").innerHTML =
          '<p class="text-danger">JSON ไม่ถูกต้อง</p>';
      }
    }

    // ---------------- LIFF Init ----------------
    async function main(){
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login(); return; }

      // check deep link
      const urlParams = new URLSearchParams(window.location.search);
      const flexid = urlParams.get("flexid");
      if(flexid){
        try{
          const res = await fetch(`${GAS_URL}?lid=${flexid}`);
          const data = await res.json();
          const msg = JSON.parse(window.atob(data.desc));
          await liff.shareTargetPicker([msg]);
        }catch(e){ console.error("load flexid failed",e); }
      }
    }
    main();
  </script>
</body>
</html>
