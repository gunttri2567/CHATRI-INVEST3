<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHATRI AYA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { padding:20px }
#previewArea{
  border:1px solid #ddd;border-radius:16px;
  padding:12px;background:#f5f7fb;
  min-height:420px;max-width:380px
}
.flex-bubble{
  background:#fff;border-radius:16px;overflow:hidden;
  box-shadow:0 6px 14px rgba(0,0,0,.08);margin-bottom:16px
}
</style>
</head>

<body>
<div class="row g-3">

<div class="col-md-6">
<h4>Flex Form</h4>

<textarea class="form-control mb-2" id="flexjson" rows="18">
{
  "type": "bubble",
  "size": "giga",
  "hero": {
    "type": "image",
    "url": "https://raw.githubusercontent.com/gunttri2567/triliff2025/refs/heads/branch/images/1035089.jpg",
    "size": "full",
    "aspectRatio": "1108:1478",
    "aspectMode": "cover"
  }
}
</textarea>

<input class="form-control mb-2" id="altText" placeholder="altText">

<div class="input-group mb-3">
<input class="form-control" id="demo" readonly>
<button class="btn btn-outline-secondary" onclick="copyUrl()">Copy</button>
</div>

<div class="d-flex gap-2">
<button class="btn btn-success" onclick="saveShare()">Save liff</button>
<button class="btn btn-success" onclick="sendShare()">Share Target Picker</button>
<button class="btn btn-warning" onclick="previewFlex()">Preview</button>
</div>
</div>

<div class="col-md-6">
<h4>Preview</h4>
<div id="previewArea"></div>
</div>

</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
/* ===== CONFIG ===== */
const LIFF_ID = "2000581772-J4jdMX8q";
const GAS_URL = "https://script.google.com/macros/s/AKfycbwktB_ZSm_VDDImG85Q4abmjDcBGHQqusr4PMsoWlT1d9fsADr6NaaM81uBnqq4exVL/exec";

/* ===== STATE ===== */
const qs = new URLSearchParams(location.search);
let CURRENT_LID = qs.get("flexid");

/* ===== LOAD FLEX ===== */
async function loadFlex() {
  if (!CURRENT_LID) return;

  const r = await fetch(`${GAS_URL}?flexid=${CURRENT_LID}`);
  const j = await r.json();

  if (j.status !== "success") return;

  flexjson.value = j.decoded;
  altText.value = j.altText || "";
  demo.value = j.liffUrl || "";

  previewFlex();
}

/* ===== SAVE (สำคัญที่สุด) ===== */
async function saveShare() {
  const raw = flexjson.value.trim();
  const alt = altText.value || "Flex";

  // ✅ สร้าง lid แค่ครั้งแรก
  if (!CURRENT_LID) {
    CURRENT_LID = "FLEX_" + Date.now();
  }

  const base64 = btoa(unescape(encodeURIComponent(raw)));
  const liffUrl = `https://liff.line.me/${LIFF_ID}?flexid=${CURRENT_LID}`;

  const r = await fetch(GAS_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      lid: CURRENT_LID,
      desc: base64,
      altText: alt,
      liffUrl: liffUrl
    })
  });

  const j = await r.json();
  if (j.status === "success") {
    demo.value = liffUrl;
    alert("✅ บันทึกเรียบร้อย");
  } else {
    alert("❌ บันทึกไม่สำเร็จ");
  }
}

/* ===== SHARE ===== */
async function sendShare() {
  const json = JSON.parse(flexjson.value);
  const alt = altText.value || "Flex";

  await liff.shareTargetPicker([{
    type:"flex",
    altText:alt,
    contents:json
  }]);
}

/* ===== PREVIEW ===== */
function previewFlex() {
  previewArea.innerHTML =
    "<pre style='font-size:12px'>" +
    JSON.stringify(JSON.parse(flexjson.value), null, 2) +
    "</pre>";
}

function copyUrl() {
  demo.select();
  document.execCommand("copy");
}

/* ===== INIT ===== */
async function main() {
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) return liff.login();
  loadFlex();
}
main();
</script>

</body>
</html>
