<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHATRI AYA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { padding:20px; }
#previewArea { border:1px solid #ddd; border-radius:16px; padding:12px; background:#f5f7fb; min-height:420px; max-width:380px; overflow:auto; }
.flex-bubble { background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 6px 14px rgba(0,0,0,0.08); margin-bottom:16px; }
.flex-hero img { width:100%; display:block; }
.section { padding:12px; }
.flex-footer { border-top:1px solid #eee; }
.box { display:flex; gap:8px; }
.box.vertical { flex-direction:column; }
.box.horizontal { flex-direction:row; align-items:center; }
.text { word-break:break-word; line-height:1.4; }
.t-xs{font-size:12px;} .t-sm{font-size:14px;} .t-md{font-size:16px;}
.t-lg{font-size:18px;} .t-xl{font-size:20px;} .t-xxl{font-size:22px;}
.btn-flex { display:inline-block; padding:10px 14px; border-radius:10px; text-decoration:none; border:1px solid #0d6efd; color:#0d6efd; }
.btn-flex.primary { background:#0d6efd; color:#fff; border-color:#0d6efd; }
.btn-flex.link { border:none; padding:0; color:#0d6efd; }
.sep { border-top:1px solid #e5e7eb; margin:6px 0; }
.icon { width:20px; height:20px; display:inline-block; }
</style>
</head>
<body>

<div class="row g-3">
<div class="col-md-6">
<h4>Flex Form</h4>
<div class="mb-2">
<label for="flexjson" class="form-label">JSON</label>
<textarea class="form-control" id="flexjson" rows="20">{
"type":"bubble",
"size":"giga",
"hero":{"type":"image","url":"https://raw.githubusercontent.com/gunttri2567/triliff2025/refs/heads/branch/images/1035089.jpg","size":"full","aspectRatio":"1108:1478","aspectMode":"cover"} 
}</textarea>
</div>

<div class="mb-2">
<label for="altText" class="form-label">altText</label>
<input type="text" class="form-control" id="altText" placeholder="ข้อความสั้น ๆ ที่จะแสดงแทน Flex Message">
</div>

<div class="input-group mb-3">
<input type="text" class="form-control" id="demo" placeholder="Ctrl+C > Copy liff url.">
<button class="btn btn-outline-secondary" type="button" onclick="copyUrl()">Copy</button>
</div>

<div class="d-flex flex-wrap gap-2">
<button type="button" class="btn btn-success" onclick="saveShare()">Save liff</button>
<button type="button" class="btn btn-warning" onclick="previewFlex()">Preview Flex</button>
</div>
</div>

<div class="col-md-6">
<h4>Preview</h4>
<div id="previewArea"><p class="text-muted">ยังไม่มี preview</p></div>
</div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ---------- Preview ----------
function renderFlexTo(preview) {
  preview.innerHTML='';
  let raw=document.getElementById('flexjson').value;
  let json;
  try{ json=JSON.parse(raw); }catch{ preview.innerHTML="<p class='text-danger'>JSON ไม่ถูกต้อง</p>"; return; }
  const div=document.createElement('div'); div.className='flex-bubble';
  if(json.hero){ const img=document.createElement('img'); img.src=json.hero.url; img.style.width='100%'; div.appendChild(img); }
  if(json.body){ const p=document.createElement('pre'); p.textContent=JSON.stringify(json.body,null,2); div.appendChild(p); }
  preview.appendChild(div);
}
function previewFlex(){ renderFlexTo(document.getElementById('previewArea')); }
function safePreview(){ previewFlex(); }

// ---------- Copy ----------
function copyUrl(){ let c=document.getElementById("demo"); c.select(); document.execCommand("copy"); alert("Copied URL: "+c.value); }

// ---------- Save ----------
function saveShare(){
  let sflex=document.getElementById("flexjson").value;
  let code=window.btoa(sflex);
  let lid="lid"+Date.now();
  document.getElementById("demo").value="https://liff.line.me/2000581772-J4jdMX8q/?flexid="+lid;

  const xurl="https://script.google.com/macros/s/AKfycbwktB_ZSm_VDDImG85Q4abmjDcBGHQqusr4PMsoWlT1d9fsADr6NaaM81uBnqq4exVL/exec"; // เปลี่ยนเป็น URL ของ Web App
  fetch(xurl,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({flexid:lid, code:code})
  }).then(res=>res.json()).then(j=>alert("บันทึกแล้ว: "+lid));
}

// ---------- Load flexid ----------
async function main(){
  await liff.init({liffId:"2000581772-J4jdMX8q"});
  if(!liff.isLoggedIn()) liff.login();

  const urlParams=new URLSearchParams(window.location.search);
  const flexid=urlParams.get('flexid');
  if(flexid){
    try{
      const res=await fetch("YOUR_WEBAPP_URL?flexid="+flexid);
      const data=await res.json();
      const jsonStr=atob(data.code);
      document.getElementById("flexjson").value=jsonStr;
      safePreview();
    }catch(e){ console.error("โหลด JSON ไม่สำเร็จ",e); }
  }else safePreview();

  let t=null;
  document.getElementById('flexjson').addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(safePreview,300); });
}
main();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
